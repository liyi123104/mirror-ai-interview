server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 别在响应头里暴露 Nginx 版本
    server_tokens off;

    # 简历 PDF 最大 10MB，Nginx 默认只放 1MB，不调上传会 413
    client_max_body_size 20m;

    # 文本资源压一下（JS 包 2MB → 约 700KB）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 安全响应头（always：错误响应也带）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Element Plus 需要 inline style；脚本全部来自本站打包产物
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # 带 hash 的静态资源可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 流式接口：必须关缓冲，否则会「卡十几秒然后整段蹦出来」
    location /api/interview/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 普通接口
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # 前端路由回落（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
